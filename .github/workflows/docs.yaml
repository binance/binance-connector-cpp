name: API Reference

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen

      - name: Generate the API reference
        run: |
          mkdir -p docs
          export BINANCE_VERSION="$(jq -r '."version-semver"' vcpkg.json)"
          export BINANCE_EXPORT_MACROS="$(ls clients 2>/dev/null | tr a-z A-Z | sed 's/.*/BINANCE_&_EXPORT=/' | tr '\n' ' ')"
          doxygen Doxyfile

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
